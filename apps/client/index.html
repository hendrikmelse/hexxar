<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexxar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161c;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        color: #e8eaf0;
      }
      #hud .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 220px;
        padding: 10px 12px;
        background: rgba(30, 34, 44, 0.85);
        border-radius: 8px;
        font-size: 14px;
        pointer-events: none;
      }
      #hud .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 2px;
      }
      #hud .bar {
        height: 4px;
        margin-top: 8px;
        background: #2a2f3d;
        border-radius: 2px;
        overflow: hidden;
      }
      #hud .bar-fill {
        height: 100%;
        width: 0;
        background: #8a93a8;
      }
      #hud .banner {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        background: rgba(30, 34, 44, 0.92);
        border-radius: 8px;
        font-size: 18px;
        pointer-events: none;
      }
      #hud .surrender {
        position: fixed;
        top: 12px;
        right: 12px;
        padding: 8px 14px;
        border: 0;
        border-radius: 8px;
        background: #3a2a30;
        color: #ffb4b4;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      #hud .hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 24px);
        font-size: 12px;
        color: #8a93a8;
        text-align: center;
        pointer-events: none;
      }
      #hud .dev {
        position: fixed;
        top: 84px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        max-width: 320px;
      }
      #hud .dev-button {
        padding: 6px 10px;
        border: 0;
        border-radius: 8px;
        background: #2a2f3d;
        color: #e8eaf0;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #hud .preview-label {
        font-size: 12px;
        color: #8a93a8;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
